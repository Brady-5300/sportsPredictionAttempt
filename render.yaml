# Render Blueprint: deploys the dashboard as a free web service.
# In Render: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: epl-engine
    runtime: docker
    plan: free
    # Paths are from the repo root. (Setting rootDir as well made Render
    # resolve them relative to that folder, doubling it in the path.)
    dockerfilePath: ./kalshi-epl-engine/Dockerfile
    dockerContext: ./kalshi-epl-engine
    healthCheckPath: /
    autoDeployTrigger: commit
