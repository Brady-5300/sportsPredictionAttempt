spring.application.name=kalshi-epl-engine

# Hosts like Render pass the port to listen on in PORT; locally it's 8080.
server.port=${PORT:8080}

# FotMob's own public JSON API - no key required, no publisher-enforced request cap.
# See FotMobClient for why this replaced the old RapidAPI-hosted reseller of this same data.
fotmob.base-url=https://www.fotmob.com
