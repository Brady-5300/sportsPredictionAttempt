<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPL Engine</title>
<style>
  :root {
    --green: #0AC285;
    --green-bg: rgba(10, 194, 133, 0.12);
    --green-bg-strong: rgba(10, 194, 133, 0.16);
    --red: #D91616;
    --red-bg: rgba(217, 22, 22, 0.1);
    --amber: #F2BA49;
    --amber-bg: rgba(242, 186, 73, 0.15);
    --text: rgba(0, 0, 0, 0.9);
    --text-secondary: rgba(0, 0, 0, 0.55);
    --text-faint: rgba(0, 0, 0, 0.35);
    --border: rgba(0, 0, 0, 0.07);
    --border-strong: rgba(0, 0, 0, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--green);
  }

  .brand-sub {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 13px;
    margin-left: 4px;
  }

  .refresh-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  #refreshBtn {
    border: 1px solid var(--border-strong);
    background: #fff;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
  }
  #refreshBtn:hover { background: rgba(0,0,0,0.03); }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }

  .banner {
    display: none;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    line-height: 1.5;
    align-items: flex-start;
    gap: 10px;
  }
  .banner.show { display: flex; }
  .banner .icon { font-size: 16px; line-height: 1.4; }
  .banner strong { display: block; margin-bottom: 2px; }

  .banner-offline { background: var(--red-bg); color: #7a0f0f; }
  .banner-offline strong { color: var(--red); }

  .banner-warning { background: var(--amber-bg); color: #6b5312; }
  .banner-warning strong { color: #8a6a12; }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
    margin: 28px 0 10px;
  }

  .section-title:first-child { margin-top: 0; }

  .card-list {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .market-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }
  .market-row:last-child { border-bottom: none; }

  .market-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .market-title {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .market-meta {
    font-size: 12.5px;
    color: var(--text-secondary);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .market-meta .ticker {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    color: var(--text-faint);
  }

  .market-right {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
  }

  .stat {
    text-align: right;
    min-width: 54px;
  }
  .stat .label {
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .stat .value {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    white-space: nowrap;
  }
  .badge-yes { background: var(--green-bg-strong); color: var(--green); }
  .badge-no { background: var(--red-bg); color: var(--red); }
  .badge-fair { background: rgba(0,0,0,0.05); color: var(--text-secondary); }

  .skipped-row {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .skipped-row:last-child { border-bottom: none; }
  .skipped-row .title { font-weight: 600; margin-bottom: 2px; }
  .skipped-row .reason { color: var(--text-secondary); }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .empty-state .big { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

  .pulse {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .planner {
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 28px;
  }
  .planner-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .planner-head strong { display: block; font-size: 15px; }
  .planner-head .hint { font-size: 12.5px; color: var(--text-secondary); }
  .planner-form { display: flex; align-items: center; gap: 8px; }
  .planner-form .dollar { position: relative; }
  .planner-form .dollar span {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-secondary); font-size: 14px;
  }
  .planner-form input {
    width: 120px;
    padding: 7px 10px 7px 22px;
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .planner-form button {
    border: none;
    background: var(--green);
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .planner-form button:disabled { opacity: 0.5; cursor: default; }
  #plannerResult:not(:empty) { margin-top: 14px; }
  .planner-summary {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 10px;
    line-height: 1.5;
  }
  .planner-summary strong { color: var(--text); }

  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  header { flex-wrap: wrap; gap: 8px; }
  .tab {
    border: none;
    background: none;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--green); }
  .tab-panel[hidden] { display: none; }

  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .tile { border: 1px solid var(--border-strong); border-radius: 12px; padding: 14px 16px; }
  .tile .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
  .tile .value { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  .explain { font-size: 13px; color: var(--text-secondary); line-height: 1.5; margin: 6px 0 0; }

  .calib-row { display: grid; grid-template-columns: 90px 1fr 120px; gap: 12px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .calib-row:last-child { border-bottom: none; }
  .bars { display: flex; flex-direction: column; gap: 3px; }
  .bar { height: 7px; border-radius: 4px; background: var(--text-faint); }
  .bar.actual { background: var(--green); }
  .calib-row .nums { text-align: right; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .match-card { padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .match-card:last-child { border-bottom: none; }
  .match-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .match-head .name { font-weight: 700; font-size: 14.5px; }
  .match-head .when { font-size: 12.5px; color: var(--text-secondary); }
  .outcomes { display: grid; grid-template-columns: 1fr 70px 70px; gap: 2px 12px; margin-top: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .outcomes .h { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.03em; text-align: right; }
  .outcomes .h:first-child { text-align: left; }
  .outcomes .num { text-align: right; }
  .outcomes .hit { font-weight: 700; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  .tag-pick { background: var(--green-bg-strong); color: var(--green); }
  .winner-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,0.05); color: var(--text-secondary); }
  .winner-badge.model { background: var(--green-bg-strong); color: var(--green); }
  .winner-badge.kalshi { background: rgba(0,0,0,0.08); color: var(--text); }

  .scoreline { text-align: center; padding: 22px 16px; border: 1px solid var(--border-strong); border-radius: 12px; margin-bottom: 8px; }
  .scoreline .teams { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 15px; font-weight: 700; }
  .scoreline .score { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .scoreline .verdict { margin-top: 10px; font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }
  .week-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; flex-wrap: wrap; }
  .week-row:last-child { border-bottom: none; }
  .week-row .nums { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  .preview { border: 1px solid var(--border-strong); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .pv-when { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .pv-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 10px 0 14px; }
  .pv-team { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 800; font-size: 16px; min-width: 0; text-align: center; line-height: 1.2; }
  .pv-team .name { overflow-wrap: anywhere; }
  .crest {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff; letter-spacing: 0.02em;
  }
  .pv-xg { text-align: center; }
  .pv-xg .num { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pv-xg .lbl { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }

  .prob-label-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin: 8px 0 4px; }
  .prob-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 700; color: #fff; }
  .prob-bar.thin { height: 8px; border-radius: 4px; }
  .prob-bar > div { display: flex; align-items: center; justify-content: center; min-width: 0; overflow: hidden; white-space: nowrap; }
  .seg-home { background: var(--green); }
  .seg-draw { background: #9aa3ad; }
  .seg-away { background: #3b4552; }

  .pv-facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .chip { font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: rgba(0,0,0,0.05); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip strong { font-weight: 800; }
  .chip.top { background: var(--green-bg-strong); color: #087a55; }
  .pv-facts .lbl { font-size: 12px; color: var(--text-secondary); margin-right: 2px; }

  details.tape { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 10px; }
  details.tape summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--text-secondary); list-style: none; }
  details.tape summary::-webkit-details-marker { display: none; }
  details.tape summary::before { content: '\25B8  '; }
  details.tape[open] summary::before { content: '\25BE  '; }
  .tape-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 12px; }
  .tape-col h4 { margin: 0 0 8px; font-size: 13.5px; }
  .stat-line { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .stat-line .rank { color: var(--text-secondary); font-size: 12px; }
  .meter { height: 6px; background: rgba(0,0,0,0.06); border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
  .meter > div { height: 100%; border-radius: 3px; background: var(--green); }
  .meter.def > div { background: #3b4552; }
  .form { display: flex; gap: 4px; margin: 4px 0 12px; flex-wrap: wrap; }
  .form .f {
    width: 26px; height: 26px; border-radius: 6px; font-size: 11.5px; font-weight: 800; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; cursor: default;
  }
  .f.W { background: var(--green); } .f.D { background: #9aa3ad; } .f.L { background: var(--red); }
  .threat { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
  .threat .x { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .sub-h { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }

  @media (max-width: 640px) {
    .market-row { flex-wrap: wrap; }
    .market-right { width: 100%; justify-content: space-between; }
    .tabs { padding: 0 8px; }
    .tab { padding: 12px 10px; }
    header { padding: 12px 16px; }
    .brand-sub { display: none; }
    .pv-team { font-size: 14px; gap: 4px; }
    .pv-team .crest { width: 28px; height: 28px; font-size: 10.5px; }
    .pv-xg .num { font-size: 20px; }
    .tape-grid { grid-template-columns: 1fr; }
    .calib-row { grid-template-columns: 70px 1fr 90px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    EPL Engine
    <span class="brand-sub">Kalshi market scanner</span>
  </div>
  <div class="refresh-info">
    <span class="pulse" id="pulseDot"></span>
    <span id="lastUpdated">Loading&hellip;</span>
    <button id="refreshBtn">Refresh</button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" role="tab" data-tab="markets" aria-selected="true">Markets</button>
  <button class="tab" role="tab" data-tab="previews" aria-selected="false">Match previews</button>
  <button class="tab" role="tab" data-tab="track" aria-selected="false">Track record</button>
  <button class="tab" role="tab" data-tab="scoreboard" aria-selected="false">Model vs Kalshi</button>
</nav>

<main>
<div class="tab-panel" id="tab-markets" role="tabpanel">
  <div class="banner banner-offline" id="offlineBanner">
    <span class="icon">&#9888;</span>
    <div>
      <strong>Scrapers offline</strong>
      <span id="offlineMessage"></span>
    </div>
  </div>

  <div class="banner banner-warning" id="warningBanner">
    <span class="icon">&#9888;</span>
    <div>
      <strong>Partial data</strong>
      <span id="warningMessage"></span>
    </div>
  </div>

  <section class="planner">
    <div class="planner-head">
      <div>
        <strong>Weekend wager planner</strong>
        <span class="hint">Splits a budget across this weekend's undervalued picks, more on bigger edges.</span>
      </div>
      <form class="planner-form" id="plannerForm">
        <label class="dollar" for="budgetInput"><span>$</span>
          <input type="number" id="budgetInput" min="1" step="1" placeholder="50" required aria-label="Weekend budget in dollars">
        </label>
        <button type="submit" id="plannerBtn">Suggest</button>
      </form>
    </div>
    <div id="plannerResult"></div>
  </section>

  <div id="content"></div>
</div>

<div class="tab-panel" id="tab-previews" role="tabpanel" hidden>
  <div id="previewsContent"><div class="empty-state">Loading match previews&hellip; the first load can take a minute or two.</div></div>
</div>

<div class="tab-panel" id="tab-track" role="tabpanel" hidden>
  <div id="trackContent"><div class="empty-state">Loading&hellip;</div></div>
</div>

<div class="tab-panel" id="tab-scoreboard" role="tabpanel" hidden>
  <div id="scoreboardContent"><div class="empty-state">Loading&hellip;</div></div>
</div>
</main>

<script>
  const REFRESH_INTERVAL_MS = 30000;
  let refreshTimer = null;

  function fmtTime(date) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function fmtKickoffTime(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function fmtMatchDay(iso) {
    if (!iso) return 'Date TBD';
    return new Date(iso).toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }

  // Evaluations arrive sorted by kickoff; group consecutive ones under a heading per day.
  function renderMarketsByDay(evaluations) {
    let html = '';
    let currentDay = null;
    let rows = [];
    const flush = () => {
      if (rows.length) html += '<div class="card-list">' + rows.join('') + '</div>';
      rows = [];
    };
    for (const m of evaluations) {
      const day = fmtMatchDay(m.kickoff);
      if (day !== currentDay) {
        flush();
        html += '<div class="section-title">' + escapeHtml(day) + '</div>';
        currentDay = day;
      }
      rows.push(renderMarketRow(m));
    }
    flush();
    return html;
  }

  const money = (n) => '$' + n.toFixed(2);

  function renderPlanner(plan) {
    if (!plan.picks.length) {
      return `<div class="planner-summary">No undervalued picks for this weekend right now, so nothing to bet. Your ${money(plan.budgetDollars)} stays in your pocket.</div>`;
    }
    const rows = plan.picks.map(p => `
      <div class="market-row">
        <div class="market-left">
          <div class="market-title">${escapeHtml(p.title)}</div>
          <div class="market-meta">
            <span>${escapeHtml(fmtMatchDay(p.kickoff))}, ${escapeHtml(fmtKickoffTime(p.kickoff))}</span>
            <span>Model ${escapeHtml(p.modelProbability)}</span>
            <span>Edge ${escapeHtml(p.edge)}</span>
            <span>Buy at ${p.buyPriceCents}&cent; + ${p.feeCents}&cent; fee</span>
          </div>
        </div>
        <div class="market-right">
          <div class="stat"><div class="label">Share</div><div class="value">${p.sharePercent.toFixed(1)}%</div></div>
          <div class="stat"><div class="label">Contracts</div><div class="value">${p.contracts}</div></div>
          <div class="stat"><div class="label">Cost</div><div class="value">${money(p.costDollars)}</div></div>
          <div class="stat"><div class="label">Pays if wins</div><div class="value">${money(p.payoutDollars)}</div></div>
        </div>
      </div>`).join('');
    const skipped = plan.picks.filter(p => p.contracts === 0).length;
    return `
      <div class="card-list">${rows}</div>
      <div class="planner-summary">
        Total cost <strong>${money(plan.costDollars)}</strong> of your ${money(plan.budgetDollars)}
        (${money(plan.unspentDollars)} left over, since Kalshi only sells whole contracts${skipped ? `; ${skipped} pick${skipped > 1 ? 's' : ''} too small to buy even one` : ''}).
        Picks cover kickoffs through ${escapeHtml(fmtMatchDay(plan.windowEnd))}. Prices move &mdash; check again right before buying.
        These edges come from the model, which hasn't yet been shown to beat the market.
      </div>`;
  }

  async function runPlanner(event) {
    event.preventDefault();
    const budget = parseFloat(document.getElementById('budgetInput').value);
    const out = document.getElementById('plannerResult');
    const btn = document.getElementById('plannerBtn');
    if (!(budget > 0)) {
      out.innerHTML = '<div class="planner-summary">Enter a dollar amount above zero.</div>';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Working…';
    try {
      const res = await fetch('/api/kalshi/allocate?budget=' + encodeURIComponent(budget));
      const body = await res.json();
      out.innerHTML = res.ok ? renderPlanner(body) : `<div class="planner-summary">${escapeHtml(body.error || 'Something went wrong.')}</div>`;
    } catch (e) {
      out.innerHTML = `<div class="planner-summary">Couldn't reach the app: ${escapeHtml(e.message)}</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Suggest';
    }
  }

  function badgeClass(rec) {
    if (rec && rec.startsWith('YES')) return 'badge-yes';
    if (rec && rec.startsWith('AVOID')) return 'badge-no';
    return 'badge-fair';
  }

  function renderMarketRow(m) {
    return `
      <div class="market-row">
        <div class="market-left">
          <div class="market-title">${escapeHtml(m.title)}</div>
          <div class="market-meta">
            ${m.kickoff ? `<span>${escapeHtml(fmtKickoffTime(m.kickoff))}</span>` : ''}
            <span class="ticker">${escapeHtml(m.ticker)}</span>
            <span>Model ${escapeHtml(m.modelProbability)}</span>
            <span>Market ${escapeHtml(m.marketProbability)}</span>
            <span>Edge ${escapeHtml(m.edge)}</span>
          </div>
        </div>
        <div class="market-right">
          <div class="stat">
            <div class="label">Buy at</div>
            <div class="value">${m.kalshiPriceCents}&cent;</div>
          </div>
          <div class="stat">
            <div class="label">Kelly</div>
            <div class="value">${m.recommendedWagerPercent.toFixed(1)}%</div>
          </div>
          <span class="badge ${badgeClass(m.recommendation)}">${escapeHtml(m.recommendation)}</span>
        </div>
      </div>`;
  }

  function renderSkippedRow(s) {
    return `
      <div class="skipped-row">
        <div class="title">${escapeHtml(s.title)} <span style="color:var(--text-faint);font-weight:400;">(${escapeHtml(s.ticker)})</span></div>
        <div class="reason">${escapeHtml(s.reason)}</div>
      </div>`;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  async function loadData() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = 'Refreshing…';

    try {
      const res = await fetch('/api/kalshi/scan');
      const data = await res.json();
      render(data);
      document.getElementById('lastUpdated').textContent = 'Updated ' + fmtTime(new Date());
    } catch (e) {
      document.getElementById('lastUpdated').textContent = 'Failed to load: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Refresh';
    }
  }

  function render(data) {
    const offlineBanner = document.getElementById('offlineBanner');
    const warningBanner = document.getElementById('warningBanner');
    const content = document.getElementById('content');

    if (data.status !== 'OK') {
      offlineBanner.classList.add('show');
      document.getElementById('offlineMessage').textContent = data.message || 'A core data source is unavailable.';
      warningBanner.classList.remove('show');
      content.innerHTML = `
        <div class="empty-state">
          <div class="big">No markets evaluated</div>
          <div>Waiting for the data source to recover before scanning resumes.</div>
        </div>`;
      return;
    }

    offlineBanner.classList.remove('show');

    if (data.warning) {
      warningBanner.classList.add('show');
      document.getElementById('warningMessage').textContent = data.warning;
    } else {
      warningBanner.classList.remove('show');
    }

    let html = '';

    if (data.evaluations && data.evaluations.length > 0) {
      html += renderMarketsByDay(data.evaluations);
    } else {
      html += `
        <div class="empty-state">
          <div class="big">No active markets right now</div>
          <div>Check back closer to kickoff.</div>
        </div>`;
    }

    if (data.skipped && data.skipped.length > 0) {
      html += '<div class="section-title">Skipped (' + data.skipped.length + ')</div>';
      html += '<div class="card-list">' + data.skipped.map(renderSkippedRow).join('') + '</div>';
    }

    content.innerHTML = html;
  }

  // ---------------------------------------------------------------- tabs

  const TABS = ['markets', 'previews', 'track', 'scoreboard'];

  function showTab(name) {
    if (!TABS.includes(name)) name = 'markets';
    for (const t of TABS) {
      document.getElementById('tab-' + t).hidden = t !== name;
      document.querySelector(`.tab[data-tab="${t}"]`).setAttribute('aria-selected', String(t === name));
    }
    if (name === 'previews') loadPreviews();
    if (name === 'track' || name === 'scoreboard') loadTrackRecord();
  }

  // ---------------------------------------------------------------- match previews

  const PREVIEW_REFRESH_MS = 5 * 60 * 1000;
  let previewsLoadedAt = 0;

  async function loadPreviews() {
    if (Date.now() - previewsLoadedAt < PREVIEW_REFRESH_MS) return;
    const out = document.getElementById('previewsContent');
    try {
      const res = await fetch('/api/kalshi/previews');
      const body = await res.json();
      if (!res.ok) {
        out.innerHTML = `<div class="empty-state">${escapeHtml(body.error || 'Previews unavailable right now.')}</div>`;
        return;
      }
      previewsLoadedAt = Date.now();
      out.innerHTML = body.length ? renderPreviews(body)
        : '<div class="empty-state"><div class="big">No upcoming matches</div><div>Previews appear once Kalshi opens markets for the next round.</div></div>';
    } catch (e) {
      out.innerHTML = `<div class="empty-state">Couldn't load previews: ${escapeHtml(e.message)}</div>`;
    }
  }

  // A stable colour per team name, so each club keeps the same crest colour.
  const CREST_COLOURS = ['#0AC285', '#3b6fd8', '#d8573b', '#8a4fd8', '#d8a23b', '#1f9bb5', '#c23b78', '#4a5568', '#2f855a', '#b7791f'];
  function crest(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    const words = name.split(/\s+/).filter(w => w[0] && w[0] === w[0].toUpperCase());
    const initials = words.length > 1 ? words.map(w => w[0]).join('').slice(0, 3) : name.slice(0, 3);
    return `<span class="crest" style="background:${CREST_COLOURS[h % CREST_COLOURS.length]}">${escapeHtml(initials.toUpperCase())}</span>`;
  }

  const ordinal = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');

  function probBar(home, draw, away, thin) {
    const seg = (cls, p) => `<div class="${cls}" style="width:${(p * 100).toFixed(1)}%">${thin || p < 0.09 ? '' : pctOf(p)}</div>`;
    return `<div class="prob-bar ${thin ? 'thin' : ''}">${seg('seg-home', home)}${seg('seg-draw', draw)}${seg('seg-away', away)}</div>`;
  }

  function formChips(form) {
    if (!form.length) return '<div class="explain">No matches yet this season.</div>';
    return '<div class="form">' + [...form].reverse().map(m => {
      const known = m.goalsFor != null && m.goalsAgainst != null;
      const r = !known ? 'D' : m.goalsFor > m.goalsAgainst ? 'W' : m.goalsFor < m.goalsAgainst ? 'L' : 'D';
      const tip = `${m.home ? 'vs' : '@'} ${m.opponent}: ${known ? m.goalsFor + '-' + m.goalsAgainst : '?'} (xG ${m.xgFor.toFixed(1)}-${m.xgAgainst.toFixed(1)}), ${m.date}`;
      return `<span class="f ${r}" title="${escapeHtml(tip)}">${r}</span>`;
    }).join('') + '</div>';
  }

  function tapeColumn(t, maxAttack, maxDefense) {
    const rank = (r) => r ? `${ordinal(r)} of ${t.leagueSize}` : 'unranked';
    return `
      <div class="tape-col">
        <h4>${escapeHtml(t.name)}</h4>
        <div class="stat-line"><span>Attack: <strong>${t.attack.toFixed(2)}</strong> xG/match</span><span class="rank">${rank(t.attackRank)}</span></div>
        <div class="meter"><div style="width:${Math.min(100, t.attack / maxAttack * 100)}%"></div></div>
        <div class="stat-line"><span>Defence: <strong>${t.defense.toFixed(2)}</strong> xG conceded</span><span class="rank">${rank(t.defenseRank)}</span></div>
        <div class="meter def"><div style="width:${Math.min(100, (1 - (t.defense - 0.6) / (maxDefense - 0.6 || 1)) * 100)}%"></div></div>
        <div class="sub-h">Last ${t.form.length} (oldest &rarr; newest)</div>
        ${formChips(t.form)}
        <div class="sub-h">Top threats (xG per 90)</div>
        ${t.threats.length ? t.threats.map(p => `<div class="threat"><span>${escapeHtml(p.player)}</span><span class="x">${p.xgPer90.toFixed(2)}</span></div>`).join('')
          : '<div class="explain">Not enough minutes played yet.</div>'}
      </div>`;
  }

  function renderPreview(p) {
    const hasKalshi = p.kalshiHomeWin != null;
    const maxAttack = Math.max(p.homeTeam.attack, p.awayTeam.attack, 2.0);
    const maxDefense = Math.max(p.homeTeam.defense, p.awayTeam.defense, 2.0);
    const scores = p.likelyScores.map((s, i) => `<span class="chip ${i === 0 ? 'top' : ''}"><strong>${s.home}&ndash;${s.away}</strong> ${pctOf(s.probability)}</span>`).join('');
    return `
      <article class="preview">
        <div class="pv-when">${p.kickoff ? escapeHtml(fmtKickoffTime(p.kickoff)) : 'Kickoff TBD'}</div>
        <div class="pv-teams">
          <div class="pv-team">${crest(p.home)}<span class="name">${escapeHtml(p.home)}</span></div>
          <div class="pv-xg"><div class="num">${p.homeExpectedGoals.toFixed(1)} &ndash; ${p.awayExpectedGoals.toFixed(1)}</div><div class="lbl">expected goals</div></div>
          <div class="pv-team">${crest(p.away)}<span class="name">${escapeHtml(p.away)}</span></div>
        </div>
        <div class="prob-label-row"><span>Model</span><span>${escapeHtml(p.home)} &middot; Draw &middot; ${escapeHtml(p.away)}</span></div>
        ${probBar(p.homeWin, p.draw, p.awayWin, false)}
        ${hasKalshi ? `
          <div class="prob-label-row"><span>Kalshi</span><span>${pctOf(p.kalshiHomeWin)} &middot; ${pctOf(p.kalshiDraw)} &middot; ${pctOf(p.kalshiAwayWin)}</span></div>
          ${probBar(p.kalshiHomeWin, p.kalshiDraw, p.kalshiAwayWin, true)}` : ''}
        <div class="pv-facts">
          <span class="lbl">Likely scores</span>${scores}
        </div>
        <div class="pv-facts">
          <span class="chip">Both teams score <strong>${pctOf(p.bothTeamsScore)}</strong></span>
          <span class="chip">Over 2.5 goals <strong>${pctOf(p.overTwoAndHalfGoals)}</strong></span>
        </div>
        <details class="tape">
          <summary>Tale of the tape</summary>
          <div class="tape-grid">
            ${tapeColumn(p.homeTeam, maxAttack, maxDefense)}
            ${tapeColumn(p.awayTeam, maxAttack, maxDefense)}
          </div>
        </details>
      </article>`;
  }

  function renderPreviews(previews) {
    let html = '<p class="explain" style="margin:0 0 16px">The model\'s view of every upcoming match. Ratings are expected goals (xG) per match, adjusted for opponent strength. Tap a match\'s "Tale of the tape" for form and top threats.</p>';
    let currentDay = null;
    for (const p of previews) {
      const day = fmtMatchDay(p.kickoff);
      if (day !== currentDay) {
        html += '<div class="section-title">' + escapeHtml(day) + '</div>';
        currentDay = day;
      }
      html += renderPreview(p);
    }
    return html;
  }

  document.querySelector('.tabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.tab');
    if (tab) location.hash = tab.dataset.tab === 'markets' ? '' : tab.dataset.tab;
  });
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

  // ---------------------------------------------------------------- track record + scoreboard

  const pctOf = (p) => (p * 100).toFixed(0) + '%';
  const brier = (b) => b.toFixed(3);
  const winnerText = { model: 'Model closer', kalshi: 'Kalshi closer', tie: 'Dead even' };

  const EMPTY_LOG = `
    <div class="empty-state">
      <div style="font-size:34px;margin-bottom:8px">&#128679;</div>
      <div class="big">Under construction by Brady</div>
      <div>First results land after this weekend's matches. The app is logging every prediction before kickoff right now.</div>
    </div>`;

  async function loadTrackRecord() {
    try {
      const res = await fetch('/api/prediction-log/track-record');
      const record = await res.json();
      document.getElementById('trackContent').innerHTML = record.finishedMatches ? renderTrackRecord(record) : EMPTY_LOG;
      document.getElementById('scoreboardContent').innerHTML = record.finishedMatches ? renderScoreboard(record) : EMPTY_LOG;
    } catch (e) {
      const msg = `<div class="empty-state">Couldn't load the track record: ${escapeHtml(e.message)}</div>`;
      document.getElementById('trackContent').innerHTML = msg;
      document.getElementById('scoreboardContent').innerHTML = msg;
    }
  }

  function renderTrackRecord(r) {
    const p = r.picks;
    const profitClass = p.profit > 0 ? 'pos' : p.profit < 0 ? 'neg' : '';
    const o = r.overall;
    const tiles = `
      <div class="tiles">
        <div class="tile">
          <div class="label">Finished matches</div>
          <div class="value">${r.finishedMatches}</div>
          <div class="sub">${o.comparedPredictions} outcomes with a Kalshi price to compare</div>
        </div>
        <div class="tile">
          <div class="label">Accuracy (Brier, lower = better)</div>
          <div class="value">${o.comparedPredictions ? brier(o.modelBrier) : '&ndash;'}</div>
          <div class="sub">${o.comparedPredictions ? `Kalshi: ${brier(o.marketBrier)}` : 'No Kalshi prices to compare yet'}</div>
        </div>
        <div class="tile">
          <div class="label">YES picks, $1 each</div>
          <div class="value ${profitClass}">${p.picks ? (p.profit >= 0 ? '+' : '&minus;') + money(Math.abs(p.profit)) : '&ndash;'}</div>
          <div class="sub">${p.picks ? `${p.wins} of ${p.picks} hit &middot; ${money(p.staked)} in, ${money(p.returned)} back` : 'No picks among finished matches yet'}</div>
        </div>
      </div>
      <p class="explain">Brier score is the average squared gap between a forecast and what happened (1 if it happened, 0 if not).
      Saying 50% every time scores 0.250; lower is better.</p>`;

    const calib = r.calibration.map(b => `
      <div class="calib-row">
        <div>${escapeHtml(b.rangeLabel)}</div>
        <div class="bars" title="grey = what the model said, green = how often it happened">
          <div class="bar" style="width:${Math.max(2, b.avgPredictedProbability * 100)}%"></div>
          <div class="bar actual" style="width:${Math.max(2, b.actualFrequency * 100)}%"></div>
        </div>
        <div class="nums">${pctOf(b.avgPredictedProbability)} said, ${pctOf(b.actualFrequency)} hit <span style="color:var(--text-faint)">(${b.count})</span></div>
      </div>`).join('');

    const matches = r.matches.map(m => `
      <div class="match-card">
        <div class="match-head">
          <div>
            <div class="name">${escapeHtml(m.name)}</div>
            <div class="when">${escapeHtml(fmtMatchDay(m.kickoff))}${m.result ? ' &middot; Result: ' + escapeHtml(m.result) : ''}</div>
          </div>
          ${m.winner ? `<span class="winner-badge ${m.winner}">${winnerText[m.winner]}</span>` : ''}
        </div>
        <div class="outcomes">
          <div class="h">Outcome</div><div class="h">Model</div><div class="h">Kalshi</div>
          ${m.markets.map(o => `
            <div class="${o.happened ? 'hit' : ''}">${o.happened ? '&#10003; ' : ''}${escapeHtml(o.label)}${o.pick ? '<span class="tag tag-pick">PICK</span>' : ''}</div>
            <div class="num ${o.happened ? 'hit' : ''}">${pctOf(o.modelProbability)}</div>
            <div class="num ${o.happened ? 'hit' : ''}">${o.kalshiProbability == null ? '&ndash;' : pctOf(o.kalshiProbability)}</div>`).join('')}
        </div>
      </div>`).join('');

    return `
      ${tiles}
      <div class="section-title">When the model says X%, how often does it happen?</div>
      <div class="card-list">${calib}</div>
      <p class="explain">If the model is honest, the green bar matches the grey one in each row. With only a few matches the bars bounce around a lot.</p>
      <div class="section-title">Finished matches</div>
      <div class="card-list">${matches}</div>`;
  }

  function renderScoreboard(r) {
    const o = r.overall;
    let verdict;
    if (!o.comparedPredictions) {
      verdict = 'No Kalshi prices to compare yet.';
    } else {
      const gap = o.modelBrier - o.marketBrier;
      const noise = 2 * o.brierDifferenceStandardError;
      const leader = gap < 0 ? 'The model' : 'Kalshi';
      verdict = `Overall Brier: model ${brier(o.modelBrier)}, Kalshi ${brier(o.marketBrier)}. `
        + (Math.abs(gap) < noise || o.brierDifferenceStandardError === 0
          ? `${Math.abs(gap) < 0.0005 ? 'Dead even' : leader + ' is slightly ahead'}, but that's within the noise. It takes around 100 matches before a gap means much.`
          : `${leader} is ahead by more than the noise, a real gap so far.`);
    }
    const weeks = r.weeks.map(w => `
      <div class="week-row">
        <div><strong>Weekend of ${escapeHtml(fmtMatchDay(w.weekendEnding + 'T12:00:00'))}</strong>
          <span style="color:var(--text-secondary)"> &middot; ${w.matches} match${w.matches === 1 ? '' : 'es'}</span></div>
        <div class="nums">Model ${brier(w.modelBrier)} &middot; Kalshi ${brier(w.kalshiBrier)}</div>
        <span class="winner-badge ${w.winner}">${w.winner === 'model' ? 'Model wins' : w.winner === 'kalshi' ? 'Kalshi wins' : 'Tie'}</span>
      </div>`).join('');
    return `
      <div class="scoreline">
        <div class="teams"><span>Model</span><span class="score">${r.modelWeeks} &ndash; ${r.kalshiWeeks}</span><span>Kalshi</span></div>
        ${r.tiedWeeks ? `<div class="explain">${r.tiedWeeks} tied weekend${r.tiedWeeks === 1 ? '' : 's'}</div>` : ''}
        <div class="verdict">${verdict}</div>
      </div>
      <p class="explain">Each weekend, whoever's forecasts were closer to what happened (lower Brier score) wins the week.
      "Model" is the version the app's picks use; "Kalshi" is the market's price just before kickoff.</p>
      <div class="section-title">Weekend by weekend</div>
      <div class="card-list">${weeks}</div>`;
  }

  document.getElementById('refreshBtn').addEventListener('click', loadData);
  document.getElementById('plannerForm').addEventListener('submit', runPlanner);

  showTab(location.hash.slice(1));
  loadData();
  refreshTimer = setInterval(loadData, REFRESH_INTERVAL_MS);
</script>

</body>
</html>
